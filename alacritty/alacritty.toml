
[env]
TERM = "xterm-256color"

[window]
opacity = 0.75

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
size = 12
glyph_offset = { x = 0, y = 0 }

[general]

live_config_reload = true
import = [
        "~/.config/alacritty/catppuccin-mocha.toml"
]

[terminal]
shell = { program = "/bin/zsh", args = ["-l"]}
